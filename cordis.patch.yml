# gentle-ai-dsh bundle layer. Rows are inserted under their own ids, so no
# base row a user may customize is replaced. The two exceptions are the
# subagent role wiring at the end: the base `tool-subagent` row and the
# `agent-preset-registry` row, each explained where it is set.
- insert:
    # Persona: global system-prompt section (see index.js).
    - id: gentle-ai
      name: 'gentle-ai-dsh'

    # Skills shipped in this package. A separate provider at the bundled rank
    # (600), so same-name user or project skills keep priority.
    - id: gentle-ai-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: gentle-ai
        includeDefaultRoots: false
        watch: false
        bundledSkillDir: !!js >-
          process.getBuiltinModule('node:path').join(
            process.getBuiltinModule('node:path').dirname(
              process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('gentle-ai-dsh/package.json')),
            'skills')

    # Engram memory over stdio MCP. Requires the `engram` executable on PATH;
    # storage and project selection stay Engram-owned.
    - id: gentle-ai-engram
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: engram
        transport: stdio
        command: engram
        args: [mcp]
        cwd: !!js process.cwd()

# Subagent roles (#10). The base spawn delegation tool keeps its provider and
# name, starts every child under the read-only explore role unless the model
# picks another role through `agent_preset`, and offers only the gentle-ai
# roles. A patch `config` replaces the whole block, so provider and toolName
# are restated; `name` makes the patch a no-op if the row is another plugin.
# Profiles that disable this row (web) keep it disabled.
- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    agentPreset: gentle-ai-explore
    allowedAgentPresets: [gentle-ai-explore, gentle-ai-verify, gentle-ai-worker]

- insert:
    # Preset selection needs the agent-presets service. headless and acp ship
    # no registry; web ships one under this same id. The loader keeps only the
    # last row per id, so this row replaces web's identical row instead of
    # adding a second provider. `standard` keeps web's top-level default;
    # headless and acp never compose a preset for the top-level session.
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: standard

    # Each role preset mounts only the restriction plugin: a preset's own
    # tools would be exempt from its restriction, and inherited tools outside
    # the allowlist become unknown to the child. See lib/role-restrict.js.
    - id: gentle-ai-preset-explore
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: gentle-ai-explore
        name: gentle-ai explore
        description: 'Read-only subagent role: glob, grep and read.'
        plugins:
          - id: role-restrict
            name: gentle-ai-dsh/role-restrict
            config:
              role: explore

    - id: gentle-ai-preset-verify
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: gentle-ai-verify
        name: gentle-ai verify
        description: 'Verification subagent role: glob, grep, read and pwsh for checks.'
        plugins:
          - id: role-restrict
            name: gentle-ai-dsh/role-restrict
            config:
              role: verify

    # Fail-closed worker: read-only like explore until the edit-surface guard
    # exists. No edit, write, apply_patch, shell or working_directory here.
    - id: gentle-ai-preset-worker
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: gentle-ai-worker
        name: gentle-ai worker
        description: 'Worker subagent role, read-only: edit surfaces pending the guard contribution (C3).'
        plugins:
          - id: role-restrict
            name: gentle-ai-dsh/role-restrict
            config:
              role: worker
