# C2 replay overlay (test only, passed with --patch after the profile layer).
# Keyless replay model, no title LLM call, no telemetry export. The installed
# gentle-ai-dsh bundle supplies every subagent role row; this overlay does not
# touch tool-subagent, agent-preset-registry or the role presets. The bundle's
# Engram MCP row is disabled so no real Engram process or store is used.
# Fixture paths come from $DSH_SNAPSHOT_FILE, $DSH_SNAPSHOT_OVERRIDE and
# $DSH_SNAPSHOT_CHILD_FILES, set by test/c2-replay.test.js.
- id: session-title-llm
  disabled: true
- id: session-telemetry-otel
  config:
    mode: DISABLED
- id: agent-default-model
  config:
    provider: replay
    model: replay-model
- id: gentle-ai-engram
  disabled: true
- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: replay
            name: Replay
            models:
              - id: replay-model
                contextWindow: 128000
